org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Flutter plugins are cached on C: while this project builds on D:. Kotlin's
# relocatable incremental cache cannot span Windows drive roots reliably.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
